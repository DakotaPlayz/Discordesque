name: Build Mirlume Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: mirlume-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate update prompt and Electron main process
        run: |
          node --check electron/main.cjs
          node --test tests/update-prompt.test.cjs tests/server-delete.test.mjs tests/screen-share.test.mjs
      - name: Build portable app and installer
        run: npm run dist:win
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ATTACHMENT_SERVER_URL: ${{ vars.VITE_ATTACHMENT_SERVER_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # An installed NSIS build checks GitHub Releases (not Actions artifacts).
      # Publish only when the package version is new to avoid overwriting an
      # existing release with binaries bearing the same version number.
      - name: Check whether this version already has a release
        id: release_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version v$version has no release; publishing when build passes."
          fi
      - name: Ensure version tag and GitHub release exist
        if: startsWith(github.ref, 'refs/tags/v') || steps.release_check.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mirlume v$version" --notes "Windows installer and Android APK builds for Mirlume v$version."
          fi
      - name: Publish versioned Windows installer and update manifest
        if: startsWith(github.ref, 'refs/tags/v') || steps.release_check.outputs.publish == 'true'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Mirlume-Windows
          path: release/*.exe
          if-no-files-found: error
