name: Build Mirlume Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portable app and installer
        run: npm run dist:win
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ATTACHMENT_SERVER_URL: ${{ vars.VITE_ATTACHMENT_SERVER_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish tagged Windows installer as GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Mirlume-Windows
          path: release/*.exe
          if-no-files-found: error
