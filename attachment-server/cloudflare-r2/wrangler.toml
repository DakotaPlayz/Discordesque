name = "mirlume-dm-files"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "FILES"
bucket_name = "mirlume"

[triggers]
crons = ["*/15 * * * *"]

[vars]
# Replace with the URL of the EXISTING Supabase project used by Mirlume.
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
MIRLUME_ALLOWED_ORIGINS = "https://dakotaplayz.github.io,http://localhost:5173,capacitor://localhost,http://localhost,null"

# Set SUPABASE_ANON_KEY as a Wrangler secret; do not commit a service_role key.
